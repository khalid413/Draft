; /etc/supervisor/conf.d/draft-duel-reverb.conf — keeps the Reverb WebSocket server running.
[program:draft-duel-reverb]
command=php /var/www/draft-duel/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/draft-duel
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
minfds=10000
redirect_stderr=true
stdout_logfile=/var/www/draft-duel/storage/logs/reverb.log
stopwaitsecs=10
